name: Build Windows Portable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      # Compilation directe de l'exécutable Rust/Tauri sans créer d'installeur lourd
      - name: Build Portable EXE
        run: npm run tauri build -- --no-bundle

      # Récupération unique du .exe portable brut
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: cloud-drive-manager-portable
          path: src-tauri/target/release/cloud-drive-manager.exe