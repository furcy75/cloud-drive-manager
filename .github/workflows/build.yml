name: Build Windows Portable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Mise en cache automatique de npm / node_modules
      - name: Setup Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 2. Mise en cache intelligente de Cargo (crates et binaires intermédiaires)
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      # Compilation incrémentale (seuls vos fichiers modifiés seront recompilés)
      - name: Build Portable EXE
        run: npm run tauri build -- --no-bundle

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: CloudDriveManager-Portable
          path: src-tauri/target/release/cloud-drive-manager.exe